<!DOCTYPE html>
<html>
<head>
    <title>My Advertisements</title>
    <link href="/notification-system/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="/notification-system/webjars/jquery/jquery.min.js"></script>
    <script src="/notification-system/webjars/sockjs-client/sockjs.min.js"></script>
    <script src="/notification-system/webjars/stomp-websocket/stomp.min.js"></script>
    <script src="/notification-system/app.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
    enabled. Please enable
    Javascript and reload this page!</h2></noscript>
<div id="main-content" class="container">
    <div class="row">
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="userId">User ID:</label>
                    <input type="text" id="userId" class="form-control" placeholder="Your user ID here...">
                    <button id="disconnect" class="btn btn-default" type="submit">Disconnect</button>
                    </button>
                </div>
            </form>
        </div>

    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="advertisements_grid" class="table table-striped">
                <thead>
                <tr>
                    <th>ADVERTISEMENTS</th>
                </tr>
                </thead>
                <tbody id="advertisements">
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
