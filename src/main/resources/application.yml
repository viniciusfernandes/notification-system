server:
  port: 8098
  servlet:
    context-path: /notification-system
  error:
    include-message: 'always'
    include-binding-errors: 'always'
    include-exception: 'false'


## Values: HASHTABLE, MONGODB
database:
    strategy: HASHTABLE

notification:
  cron: "*/5 * * * * *"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operationsSorter: method
    path: /swagger.html

spring:
  profiles:
    active: local

kafka:
  bootstrap-servers: kafka-network:9092
  topic:
    groupId: notification
    notification: topic-advertisement-notifications

---
spring:
  profiles:
    active: docker

kafka:
  bootstrap-servers: kafka-network:9092
  topic:
    groupId: notification
    notification: topic-advertisement-notifications
---