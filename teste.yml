version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:6.0.1
    ports:
      - 2181:2181
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - kafka-network
    hostname: zookeeper-server
    container_name: zookeeper-server

  kafka:
    image: confluentinc/cp-kafka:6.0.1
    hostname: kafka-server
    container_name: kafka-server
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-server:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - kafka-network

  control-center:
    image: confluentinc/cp-enterprise-control-center:5.4.0
    hostname: kafka-control-center
    container_name: kafka-control-center
    depends_on:
      - zookeeper
      - kafka
    ports:
      - "9021:9021"
    networks:
      - kafka-network
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka-server:29092'
      CONTROL_CENTER_ZOOKEEPER_CONNECT: 'zookeeper-server:2181'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  mongo:
    image: mongo
    hostname: mongo-server
    container_name: mongo-server
    restart: always
    ports:
      - 27017:27017
    networks:
      - kafka-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=1234
      - MONGO_INITDB_DATABASE=admin
      - MONGO_DB_USERNAME=admin
      - MONGO_DB_PASSWORD=1234

    #command: mongod --auth

  redis:
    image: redis:latest
    hostname: redis-server
    container_name: redis-server
    ports:
      - 6379:6379
    networks:
      - redis-network

  #advertisement-notification:
    #image: viniciussf/advertisement-notification:latest
    #hostname: advertisement-notification
    #container_name: advertisement-notification
    #ports:
     # - "8099:8099"
    #networks:
    #  - kafka-network
    #depends_on:
     # - kafka
     # - mongo

networks:
  kafka-network:
  redis-network:
